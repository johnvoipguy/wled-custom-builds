targets:
  - target: sp530e
    display_name: SP530E
    shared:
      usermods:
        - boot_status_led
        - wifi_status_led
      partitions:
        - WLED_ESP32C3_4MB_audioreactive.csv
    versions:
      - version: v15
        wled_line: 0.15.x
        platformio_env: sp530e
        notes: Legacy SP530E release line carried forward into the neutral layout.
      - version: v16
        wled_line: 16.x / main
        platformio_env: sp530e
        notes: Starter slot for the current SP530E mainline work.
  - target: seeed-xiao-esp32s3
    display_name: Seeed Xiao ESP32S3
    shared:
      platformio_env_fragment: targets/seeed-xiao-esp32s3/shared/platformio.env.ini
      usermods: []
      partitions: []
    versions:
      - version: v15
        wled_line: 0.15.x
        platformio_env: seeed_xiao_esp32s3v2
        notes: Version delta — see targets/seeed-xiao-esp32s3/v15/notes.md. Base env defined in shared/platformio.env.ini.
      - version: v16
        wled_line: 16.x / main
        platformio_env: seeed_xiao_esp32s3v2
        notes: Version delta — see targets/seeed-xiao-esp32s3/v16/notes.md. Base env defined in shared/platformio.env.ini.
  - target: waveshare-esp32s3-eth
    display_name: Waveshare ESP32S3 Ethernet
    shared:
      platformio_env_fragment: targets/waveshare-esp32s3-eth/shared/platformio.env.ini
      usermods: []
      partitions: []
      note: shared/ is the v15 line's source of truth only; v16 has its own env fragment (see v16 notes below).
    versions:
      - version: v15
        wled_line: 0.15.x
        platformio_env: waveshare_esp32s3_eth
        notes: Preserved/frozen legacy line. Canonical env is in shared/platformio.env.ini; v15 owns preserved legacy firmware assets. Not actively developed against.
      - version: v16
        wled_line: 16.0.1
        platformio_env: waveshare_esp32s3_eth
        notes: Active Waveshare line. W5500 ported from waveshare-esp32s3-eth-v15.1 with a real hardware-socket driver; own env/patches/lib under targets/waveshare-esp32s3-eth/v16 (not shared/). Compiles clean against wled/WLED v16.0.1; not yet hardware-validated. See v16/notes.md.
