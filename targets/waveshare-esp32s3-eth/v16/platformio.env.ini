; Waveshare ESP32S3 Ethernet — v16 target-owned PlatformIO environment fragment
;
; SOURCE OF TRUTH for the v16 line: this file (NOT ../shared/platformio.env.ini).
;
; Why this diverges from shared/platformio.env.ini: the shared fragment predates a working
; W5500 driver in this repo — its W5500_*_PIN build flags were never consumed by any C++ code
; (see targets/waveshare-esp32s3-eth/v16/notes.md for the full history). This file is the
; env that actually matches the v16 W5500 driver code applied via
; targets/waveshare-esp32s3-eth/v16/patches/0001-w5500-native-hardware-socket-ethernet.patch
; and the vendored library in targets/waveshare-esp32s3-eth/v16/lib/Ethernet_Generic.
; Verified: compiles clean against a real wled/WLED v16.0.1 checkout (RAM 13.7%, Flash 39.3%
; on the 16MB/extreme_partitions layout below).
;
; Layering model:
;   root platformio.ini                  — generic WLED base / upstream defaults
;   targets/<target>/shared/             — target source of truth for the v15 line only (frozen)
;   targets/<target>/v16/                — THIS FILE: v16 source of truth (pins, driver, patches, lib)
;
; Usage with apply-target.sh / build-target.sh:
;   scripts/build-target.sh --target waveshare-esp32s3-eth --version v16
;   (fetches wled_ref from build.json, applies this env fragment + patches/ + lib/, builds)

[env:waveshare_esp32s3_eth]
extends = env:esp32s3dev_8MB_opi
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"WAVESHARE-ESP32S3-ETH\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D WLED_DISABLE_INFRARED
  ; ^ Required, not optional: IRremoteESP8266 (WLED's default IR remote support) and the W5500
  ; driver's Ethernet_Generic library both define a global enum value named UNKNOWN. Building
  ; both into the same firmware is a hard compile error (verified). If a future revision needs
  ; both IR remote control and W5500 Ethernet, the fix is patching Ethernet_Generic's w5100.h
  ; enum name, not removing this flag.
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; ^ MUST be 1 on this board: with 0, WLED's Serial output is routed to the UART0 pins
  ; instead of the USB port, so a serial monitor shows only ROM bootloader chatter and no
  ; WLED diagnostics at all. The validated v0.15.1 environment used 1; an earlier revision of
  ; this file used 0 (inherited from ../shared/) and made on-device debugging impossible.
  -D ARDUINO_USB_MODE=1
  -D WLED_DEBUG
  ; ^ Kept on for this line while W5500 behavior is still being validated on hardware.
  ; Remove once the target is proven, to reclaim flash and reduce serial noise.
  -D BOARD_HAS_PSRAM
  -D WLED_USE_ETHERNET
  -D WLED_USE_W5500
  -D WLED_ETH_DEFAULT=16
  ; ^ Index 16, not 13: WLED 16.x had already assigned ethernetType 13 to WLED_ETH_GLEDOPTO by
  ; the time this board was ported forward. The 0.15.1-line build used 13 for W5500 - that value
  ; is NOT safe to reuse in 16.x (see notes.md). This board's ethernetBoards[] slot is appended
  ; at the end of the table (WLED_ETH_WAVESHARE_S3_ETH_W5500), not backfilled into a reused index.
  -D W5500_MISO=12 -D W5500_MOSI=11 -D W5500_SCLK=13
  -D W5500_CS=14 -D W5500_RST=9 -D W5500_INT=10
  ; ^ Pin values match ../shared/platformio.env.ini and the validated v0.15.1 hardware pinout;
  ; only the macro names changed (no _PIN suffix) to match what the ported driver code reads.
  -D WLED_AP_SSID=\"WLED-ETH-Config\"
  -D LEDPIN=-1
  -D DATA_PINS=0,1,2,3,15,16,17,18
  ; ^ 8 single-wire (WS281x-family) LED outputs via RMT (4 channels) + I2S-parallel (remaining
  ; 4) - WLED's bus_manager.cpp selects between them at runtime, no build-time split needed.
  ; GPIO0 and GPIO3 are ESP32-S3 strapping pins (safe as outputs once boot completes; GPIO0 may
  ; also be wired to a physical BOOT button on this board - see notes.md for the runtime
  ; electrical-contention caveat if that button is pressed while LEDs are actively driven).
board_build.partitions = ${esp32.extreme_partitions}
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; ^ MUST stay qio on ESP32-S3. dio is NOT selectable here: the arduino-esp32 core ships only
; bootloader_qio_80m / bootloader_qio_120m / bootloader_opi_80m for esp32s3 - there is no
; bootloader_dio_*.elf, so a dio build fails outright at the bootloader step. (The "flash_mode
; dio" boot-loop fixes elsewhere in this repo are ESP32-C3 prior art and do not transfer to S3;
; the v0.15.1 Waveshare env also declared dio, which this core cannot honor.)
monitor_filters = esp32_exception_decoder
