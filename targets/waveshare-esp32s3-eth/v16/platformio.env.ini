; Waveshare ESP32S3 Ethernet — v16 target-owned PlatformIO environment fragment
;
; SOURCE OF TRUTH for the v16 line: this file (NOT ../shared/platformio.env.ini).
;
; DERIVATION: this env is derived from the VALIDATED v0.15.1 environment
; ([env:esp32s3_waveshare_eth] on branch waveshare-esp32s3-eth-v15.1), which is the config
; known to boot and run on real hardware. Every deviation from that baseline is deliberate and
; commented inline with "16.x:" (forced by WLED 16.x) or "HW:" (this board's current wiring).
; Do NOT re-derive this file from ../shared/platformio.env.ini - that fragment's W5500 flags
; were never consumed by any code and it is not a validated configuration.

[env:waveshare_esp32s3_eth]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
upload_speed = 921600
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  -D WLED_RELEASE_NAME=\"WAVESHARE-ESP32S3-ETH\"
  -D CONFIG_LITTLEFS_FOR_IDF_3_2
  -D WLED_WATCHDOG_TIMEOUT=0
  -D WLED_DEBUG
  ;; ^ kept on while W5500 behavior is being validated on hardware; remove once proven.
  ;; USB Configuration (serial-to-USB mode, required for this board)
  ;; This board has no USB-UART bridge - USB wires straight to GPIO19/20 - so CDC_ON_BOOT=1
  ;; is required or WLED's serial output goes to the UART0 pins and a USB monitor shows
  ;; nothing but ROM bootloader chatter.
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_MSC_ON_BOOT=0
  -D ARDUINO_USB_DFU_ON_BOOT=0
  ;; PSRAM
  -D BOARD_HAS_PSRAM
  -D WLED_USE_PSRAM
  ;; W5500 SPI Ethernet - hardware TCP/IP socket engine via vendored Ethernet_Generic
  -D WLED_USE_ETHERNET
  -D WLED_USE_W5500
  -D WLED_ETH_DEFAULT=16
  ;; ^ 16.x: was 13 in v0.15.1. Index 13 is WLED_ETH_GLEDOPTO in 16.x - reusing it would
  ;; silently select a real, different board. This target's slot is appended at 16.
  -D W5500_MISO=12 -D W5500_MOSI=11 -D W5500_SCLK=13
  -D W5500_CS=14 -D W5500_INT=10 -D W5500_RST=9
  ;; ^ unchanged from v0.15.1; confirmed against the Waveshare ESP32-S3-ETH pinout diagram
  ;; (ETH_MOSI=11 ETH_MISO=12 ETH_CLK=13 ETH_CS=14 ETH_INT=10 ETH_RST=9) and an independent
  ;; standalone Arduino sketch that pulled a DHCP lease on this hardware.
  -D WLED_AP_SSID=\"WLED-ETH-Config\"
  -D WLED_AP_PASS=\"\"
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_INFRARED
  ;; ^ INFRARED must stay disabled: IRremoteESP8266 and Ethernet_Generic's w5100.h both define
  ;; a global enum value named UNKNOWN; building both is a hard compile error.
  ;; 8-Channel LED Output
  -D LEDPIN=-1
  -D DATA_PINS=0,1,2,3,15,16,17,18
  ;; ^ HW: current board routing (v0.15.1 used 48,47,38,39,40,41,42,1). Clear of the W5500
  ;; SPI pins (9-14) and the onboard SD card (GPIO4-7).
  ;; AudioReactive (I2S microphone on GPIO4)
  -D AUDIOPIN=4
  -D I2S_SDPIN=4
  -D I2S_WSPIN=-1
  -D I2S_CKPIN=-1
  -D SR_DMTYPE=1
  ;; GPIO Configuration
  -D BTNPIN=-1
  ;; ^ HW: v0.15.1 used BTNPIN=0, but GPIO0 is now an LED data pin in DATA_PINS above.
  ;; Both cannot own GPIO0 - PinManager will reject the second allocation. Set to -1 (no
  ;; button) to make the conflict explicit rather than order-dependent. If you want the BOOT
  ;; button back as a WLED button, drop GPIO0 from DATA_PINS and set BTNPIN=0.
  -D RLYPIN=-1
  -D IRPIN=-1
custom_usermods = audioreactive
;; ^ 16.x: replaces v0.15.1's "-D USERMOD_AUDIOREACTIVE" + "${esp32.AR_lib_deps}". In 16.x
;; usermods are selected by name here and their library.json pulls its own deps; the old
;; -D define is silently ignored, so copying it forward would have quietly dropped audio.
lib_deps = ${esp32s3.lib_deps}
;; ^ 16.x: v0.15.1 also listed "arduino-libraries/Ethernet @ ^2.0.2" here. That library does
;; not compile against this core (ambiguous IPAddress(0xFFFFFFFFul) overload), so the W5500
;; driver now uses the vendored, patched Ethernet_Generic in ../v16/lib/ instead, which
;; apply-target.sh copies into the workspace lib/ directory.
board_build.partitions = ${esp32.default_partitions}
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
;; ^ 16.x/core: v0.15.1 declared dio, but this core ships only bootloader_qio_80m,
;; bootloader_qio_120m and bootloader_opi_80m for esp32s3 - there is no bootloader_dio_*.elf,
;; so a dio build fails outright at the bootloader step. (The "flash-mode dio" boot-loop fixes
;; elsewhere in this repo are ESP32-C3 prior art and do not transfer to S3.)
monitor_filters = esp32_exception_decoder
