; Waveshare ESP32S3 Ethernet — v17 target-owned PlatformIO environment fragment
;
; SOURCE OF TRUTH for the v17 line: this file (NOT ../shared/platformio.env.ini, and NOT the
; v16 fragment — the two lines are architecturally different, see notes.md).
;
; This targets WLED `main` on ESP-IDF 5.5.4 / arduino-esp32 Core 3.3.8 (see build.json:
; wled_ref = "main" — a moving target, refetched on every build). W5500 is wired up as a
; first-class lwIP interface via Core 3.x's ETH_PHY_W5500, NOT the vendored hardware-socket
; driver the v16 line uses. That means realtime protocols (DDP/E1.31/MQTT) and the web UI/OTA
; all work over Ethernet with no per-protocol glue code — this is the whole reason this line
; exists instead of just continuing the v16 approach forward. Validated on hardware: DDP via
; xLights, web UI, and live LED-hardware-settings changes all pass over both Ethernet (LAN/PoE)
; and WiFi, on two boards.

[env:waveshare_esp32s3_eth_v5]
extends = env:esp32s3dev_8MB_opi
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  -D WLED_RELEASE_NAME=\"WAVESHARE-ESP32S3-ETH-V5\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D WLED_DEBUG
  ;; ^ kept on while this line is still being validated on hardware; remove once proven long-term.
  ;; USB Configuration — same rationale as v16: no USB-UART bridge on this board.
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_MSC_ON_BOOT=0
  -D ARDUINO_USB_DFU_ON_BOOT=0
  ;; PSRAM
  -D BOARD_HAS_PSRAM
  -D WLED_USE_PSRAM
  ;; W5500 SPI Ethernet — native lwIP interface (ETH_PHY_W5500), IDF5/Core3 only. Requires the
  ;; patches in ../v17/patches/ (const.h/network.cpp/wled.cpp/wled_ethernet.h/etc.) and the
  ;; vendored NeoPixelBus fix in ../v17/lib/ (see below).
  -D WLED_USE_ETHERNET
  -D WLED_USE_W5500
  -D WLED_ETH_DEFAULT=16
  ;; ^ same slot number as v16's WLED_ETH_DEFAULT; the two lines never build against the same
  ;; WLED version at once so there's no collision, but keep them in sync if either changes.
  -D W5500_MISO=12 -D W5500_MOSI=11 -D W5500_SCLK=13
  -D W5500_CS=14 -D W5500_INT=10 -D W5500_RST=9
  ;; ^ unchanged from v16/v0.15.1; confirmed against the Waveshare ESP32-S3-ETH pinout diagram.
  -D W5500_SPI_FREQ_MHZ=20
  -D WLED_AP_SSID=\"WLED-ETH-Config\"
  -D WLED_AP_PASS=\"\"
  -D LEDPIN=-1
  -D DATA_PINS=17,16,18,15,3,2,1,0
  ;; ^ Matches the physical board's actual LED header wiring, left to right. GPIO0 IS used here
  ;; (not GPIO21) - a GPIO21 hardware revision was discussed as a way to dodge GPIO0's
  ;; strapping-pin/BOOT-button caveat, but that revision does not exist yet (not fabbed) - do
  ;; not substitute GPIO21 until/unless that board revision is actually built and confirmed.
  ;; GPIO0's UI-reservation issue (WLED's settings page previously rejecting it outright) is
  ;; already fixed - see the v16 commit "Stop reserving GPIO0 and the RMII pins when W5500 is
  ;; selected" - but the physical BOOT-button-contention caveat while GPIO0 is actively driving
  ;; LED data (see v16/notes.md's "GPIO caveats") still applies and is not fully characterized.
  -D AUDIOPIN=-1 -D I2S_SDPIN=-1 -D I2S_WSPIN=-1 -D I2S_CKPIN=-1 -D SR_DMTYPE=1
  ;; ^ GPIO4 reserved for SD card, not available for audio or LED drivers
  -D BTNPIN=-1 -D RLYPIN=-1 -D IRPIN=-1
custom_usermods = audioreactive
board_build.partitions = ${esp32.extreme_partitions}
;; ^ same 16MB_9MB_FS layout as v16 — see v16/platformio.env.ini for the full rationale
;; (3MB app slots, matches the validated v0.15.1 hardware image, avoids stranding flash).
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
custom_merge_flash_mode = dio
;; ^^ These two MUST differ on this board, and both values are load-bearing — see v16's
;; platformio.env.ini for the full explanation (bootloader mode vs. merged-image header mode;
;; this board's flash requires a DIO-header image or it boot-loops in ROM before any
;; application code runs). Do not "simplify" these to a single value.
build_unflags = -flto -flto=auto -flto=thin
;; ^ diagnostic build: disable LTO so addr2line resolves crash backtraces to exact file:line
;; instead of collapsing to the enclosing function. Re-enable once confidence is high (see
;; notes.md "What's not done").
monitor_filters = esp32_exception_decoder

; Backbone-AP-Bridge (rev 1, 2026-10-11) - separate firmware on top of the v17 env above.
; W5500 <-> WiFi AP pure L2 bridge via the ESP-IDF lwIP bridge (patches/0002, usermods/ap_bridge).
; The regular v17 env above is unchanged; all bridge code is gated by WLED_AP_BRIDGE.
; Build: scripts/build-target.sh --target waveshare-esp32s3-eth --version v17 \
;          --environment waveshare_esp32s3_eth_v5_apbridge
[env:waveshare_esp32s3_eth_v5_apbridge]
extends = env:waveshare_esp32s3_eth_v5
build_unflags = ${env:waveshare_esp32s3_eth_v5.build_unflags}
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  ;; ^ built from scratch (not ${env:waveshare_esp32s3_eth_v5.build_flags}) so the 3 identity
  ;; macros below are each defined exactly once on the compiler command line. Inheriting the
  ;; base env's build_flags and then overriding via build_unflags/-D doesn't work here: ESP-IDF
  ;; components (compiled outside the Arduino-sketch SCons env, e.g. wpa_supplicant) see the
  ;; full inherited flag list regardless of build_unflags, so a second -D for the same macro
  ;; still reaches them as a "redefined" warning - which those components' own -Werror turns
  ;; into a fatal error. v17's non-bridge env above is intentionally left untouched.
  -D WLED_WATCHDOG_TIMEOUT=0
  -D WLED_DEBUG
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_MSC_ON_BOOT=0
  -D ARDUINO_USB_DFU_ON_BOOT=0
  -D BOARD_HAS_PSRAM
  -D WLED_USE_PSRAM
  -D WLED_USE_ETHERNET
  -D WLED_USE_W5500
  -D WLED_ETH_DEFAULT=16
  -D W5500_MISO=12 -D W5500_MOSI=11 -D W5500_SCLK=13
  -D W5500_CS=14 -D W5500_INT=10 -D W5500_RST=9
  -D W5500_SPI_FREQ_MHZ=40
  -D LEDPIN=-1
  -D DATA_PINS=17,16,18,15,3,2,1,0
  -D AUDIOPIN=-1 -D I2S_SDPIN=-1 -D I2S_WSPIN=-1 -D I2S_CKPIN=-1 -D SR_DMTYPE=1
  -D BTNPIN=-1 -D RLYPIN=-1 -D IRPIN=-1
  ;; ^ all copied verbatim from the v17 env above (see its own comments for rationale on each) -
  ;; only the 3 identity macros below differ.
  -D WLED_RELEASE_NAME=\"WAVESHARE-S3-ETH-APBRIDGE\"
  ;; ^ own release name: separate firmware from base v17, so it is identifiable on the info page
  ;; and WLED's OTA release check won't silently cross-flash it with the base build.
  -D WLED_AP_SSID=\"WLED_BRIDGE\"
  -D WLED_AP_PASS=\"876543210\"
  ;; ^ bridge build defaults (rev 2, 2026-10-12, John). Change them in Usermods -> ApBridge.
  -D WLED_AP_BRIDGE
custom_usermods = ${env:waveshare_esp32s3_eth_v5.custom_usermods} ap_bridge
custom_sdkconfig =
  CONFIG_ESP_NETIF_BRIDGE_EN=y
;; ^ prebuilt Core 3.x libs don't have the lwIP bridge enabled; this triggers a framework lib
;; rebuild on first build (slow). Bridge FDB size is set at runtime (WLED_AP_BRIDGE_FDB_DYN).
