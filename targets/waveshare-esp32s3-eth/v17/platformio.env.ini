; Waveshare ESP32S3 Ethernet — v17 target-owned PlatformIO environment fragment
;
; SOURCE OF TRUTH for the v17 line: this file (NOT ../shared/platformio.env.ini, and NOT the
; v16 fragment — the two lines are architecturally different, see notes.md).
;
; This targets WLED `main` on ESP-IDF 5.5.4 / arduino-esp32 Core 3.3.8 (see build.json:
; wled_ref = "main" — a moving target, refetched on every build). W5500 is wired up as a
; first-class lwIP interface via Core 3.x's ETH_PHY_W5500, NOT the vendored hardware-socket
; driver the v16 line uses. That means realtime protocols (DDP/E1.31/MQTT) and the web UI/OTA
; all work over Ethernet with no per-protocol glue code — this is the whole reason this line
; exists instead of just continuing the v16 approach forward. Validated on hardware: DDP via
; xLights, web UI, and live LED-hardware-settings changes all pass over both Ethernet (LAN/PoE)
; and WiFi, on two boards.

[env:waveshare_esp32s3_eth_v5]
extends = env:esp32s3dev_8MB_opi
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  -D WLED_RELEASE_NAME=\"WAVESHARE-ESP32S3-ETH-V5\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D WLED_DEBUG
  ;; ^ kept on while this line is still being validated on hardware; remove once proven long-term.
  ;; USB Configuration — same rationale as v16: no USB-UART bridge on this board.
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_MSC_ON_BOOT=0
  -D ARDUINO_USB_DFU_ON_BOOT=0
  ;; PSRAM
  -D BOARD_HAS_PSRAM
  -D WLED_USE_PSRAM
  ;; W5500 SPI Ethernet — native lwIP interface (ETH_PHY_W5500), IDF5/Core3 only. Requires the
  ;; patches in ../v17/patches/ (const.h/network.cpp/wled.cpp/wled_ethernet.h/etc.) and the
  ;; vendored NeoPixelBus fix in ../v17/lib/ (see below).
  -D WLED_USE_ETHERNET
  -D WLED_USE_W5500
  -D WLED_ETH_DEFAULT=16
  ;; ^ same slot number as v16's WLED_ETH_DEFAULT; the two lines never build against the same
  ;; WLED version at once so there's no collision, but keep them in sync if either changes.
  -D W5500_MISO=12 -D W5500_MOSI=11 -D W5500_SCLK=13
  -D W5500_CS=14 -D W5500_INT=10 -D W5500_RST=9
  ;; ^ unchanged from v16/v0.15.1; confirmed against the Waveshare ESP32-S3-ETH pinout diagram.
  -D W5500_SPI_FREQ_MHZ=20
  -D WLED_AP_SSID=\"WLED-ETH-Config\"
  -D WLED_AP_PASS=\"\"
  -D LEDPIN=-1
  -D DATA_PINS=18,17,16,15,3,2,1,21
  ;; ^ GPIO0 replaced by GPIO21 and moved to the END of the order (reversed vs. v16's
  ;; 0,1,2,3,15,16,17,18). GPIO0 is an ESP32-S3 strapping pin that also shares the board's BOOT
  ;; button, and it is the pin WLED's settings UI is most likely to contest; GPIO21 is free on
  ;; this board (header pin 35) and clear of the W5500 SPI pins (9-14), the SD card (4-7) and
  ;; USB (19/20).
  -D AUDIOPIN=4 -D I2S_SDPIN=4 -D I2S_WSPIN=-1 -D I2S_CKPIN=-1 -D SR_DMTYPE=1
  -D BTNPIN=-1 -D RLYPIN=-1 -D IRPIN=-1
custom_usermods = audioreactive
board_build.partitions = ${esp32.extreme_partitions}
;; ^ same 16MB_9MB_FS layout as v16 — see v16/platformio.env.ini for the full rationale
;; (3MB app slots, matches the validated v0.15.1 hardware image, avoids stranding flash).
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
custom_merge_flash_mode = dio
;; ^^ These two MUST differ on this board, and both values are load-bearing — see v16's
;; platformio.env.ini for the full explanation (bootloader mode vs. merged-image header mode;
;; this board's flash requires a DIO-header image or it boot-loops in ROM before any
;; application code runs). Do not "simplify" these to a single value.
monitor_filters = esp32_exception_decoder
