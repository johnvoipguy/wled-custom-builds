; UICD HUB75 S3 — v17 target-owned PlatformIO environment fragment
;
; SOURCE OF TRUTH for the v17 line: this file.
;
; This line tracks upstream WLED main and applies a version-scoped source patch to
; replace the stock MoonHub HUB75 pin map with this project's sequential header layout.

[env:uicd_hub75_s3]
extends = env:esp32s3dev_8MB_opi
board = lilygo-t7-s3
board_build.partitions = ${esp32.extreme_partitions}
build_flags = ${common.build_flags} ${esp32s3.build_flags} ${hub75.build_flags} ${hub75.s3_build_flags}
  -D WLED_RELEASE_NAME=\"UICD_HUB75_S3_ESP32-S3_16MB_opi\"
  -D UICPAL_S3_EFFICIENT_ROW
  -D LEDPIN=14 -D BTNPIN=0 -D RLYPIN=15 -D IRPIN=-1 -D AUDIOPIN=-1
  -D SR_DMTYPE=1 -D I2S_SDPIN=-1 -D I2S_CKPIN=-1 -D I2S_WSPIN=-1 -D MCLK_PIN=-1
lib_deps = ${esp32s3.lib_deps}
  ${hub75.lib_deps}
